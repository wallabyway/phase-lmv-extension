<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Construction Phasing — Snowdon Tower & Office.rvt</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Artifakt Element", Helvetica, Arial, sans-serif; }
        #viewer { position: absolute; inset: 0; }

        /* ---- model picker (page-level UI, floating top-left) ---- */
        #model-picker {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 20;                       /* above LMV's canvas (z-index 1) */
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(24, 30, 40, 0.94);
            color: #e8edf4;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            font-size: 12px;
            user-select: none;
        }
        .model-picker-label { color: #9fb4cc; white-space: nowrap; }
        .model-picker-select {
            background: #232c3a; color: #e8edf4;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            font-size: 12px; font-family: inherit;
            padding: 3px 6px; max-width: 240px;
        }
        .model-picker-select:disabled { opacity: 0.45; cursor: wait; }

        /* ---- phasing bar (chips above the slider, above LMV's bottom nav toolbar) ---- */
        #phasing-bar {
            position: absolute;
            left: 50%;
            bottom: 90px;                       /* navTools is ~50px tall at the bottom edge */
            transform: translateX(-50%);
            width: min(880px, calc(100vw - 32px));
            /* LMV's inner viewer container is z-index:1 — keep the bar above it */
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(24, 30, 40, 0.94);
            color: #e8edf4;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 6px 14px 8px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
            user-select: none;
            white-space: nowrap;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #phasing-bar.hidden { opacity: 0; transform: translateX(-50%) translateY(14px); pointer-events: none; }

        /* chips float above the slider track, tooltip-style, at each phase start */
        .phasing-chips { position: relative; height: 20px; margin: 0 8px; }
        .phasing-chip {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; color: #c9d6e4;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 1px 8px; cursor: pointer;
        }
        .phasing-chip:hover { background: rgba(255, 255, 255, 0.12); }
        .phasing-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
        .phasing-chip.active { outline: 1px solid #4aa8ff; background: rgba(74, 168, 255, 0.16); }

        .phasing-row { display: flex; align-items: center; gap: 10px; }
        .phasing-title {
            font-weight: 600; font-size: 12px; letter-spacing: 0.4px;
            text-transform: uppercase; color: #9fb4cc;
        }
        .phasing-slider-wrap { flex: 1 1 auto; min-width: 60px; }
        #phasing-slider { width: 100%; margin: 0; accent-color: #4aa8ff; cursor: pointer; }
        .phasing-current {
            font-size: 12px; font-weight: 600;
            padding: 3px 10px; border-radius: 20px;
            background: #2c3a4d; min-width: 90px; text-align: center;
        }
        .phasing-current.dim { color: #8fa2b8; background: #232c3a; }
        .phasing-reset {
            font-size: 11px; color: #7fd1ff; cursor: pointer;
            padding: 3px 6px; border: 1px solid rgba(127, 209, 255, 0.35); border-radius: 6px;
        }
        .phasing-reset:hover { background: rgba(127, 209, 255, 0.12); }

        @media (max-width: 820px) {
            .phasing-title { display: none; }
            .phasing-chip { padding: 1px 6px; }
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <!-- Page-level UI (index.html owns this, not the extension): pick a model
         from the sample-models bucket; the URN is handed to the loader. -->
    <div id="model-picker">
        <label class="model-picker-label" for="model-select">Model</label>
        <select id="model-select" class="model-picker-select" title="Model"></select>
    </div>
    <div id="phasing-bar" class="hidden">
        <div class="phasing-chips" id="phasing-legend"></div>
        <div class="phasing-row">
            <span class="phasing-title">Construction Phasing</span>
            <div class="phasing-slider-wrap">
                <input type="range" id="phasing-slider" min="0" max="1000" step="1" value="0">
            </div>
            <span class="phasing-current" id="phasing-current">—</span>
            <span class="phasing-reset" id="phasing-reset">reset</span>
        </div>
    </div>
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
    <script type="module">
        /* ============================================================================
         * LMV bootstrap — model URN and viewer startup.
         * UI / extension wiring lives in ext/ui.mjs; phasing logic in ext/phasing.mjs.
         * ========================================================================== */

        import { PhasingExtension, DEFAULT_PHASES } from './ext/ui.mjs?v=6';

        const TOKEN_API = 'https://d1rfabreh9lcnl.cloudfront.net/api/auth/token';
        const TOKEN_EXPIRES_IN = 3600;

        // No embedded fallback token: the viewer cannot authenticate without a
        // fresh token from the API, so fail loudly instead of silently using a
        // stale one (which yields confusing 401s on model load).
        async function fetchAccessToken() {
            const resp = await fetch(TOKEN_API);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const { access_token } = await resp.json();
            if (!access_token) throw new Error('token API returned no access_token');
            console.log('[phasing] access token fetched from API');
            return access_token;
        }

        // Model picker — page-level UI. The catalog comes from the
        // sample-models bucket API; MODEL_FALLBACK (Snowdon + Office) covers
        // the endpoint being down. Selecting a model just passes its URN to
        // the loader; the extension never touches this combo box.
        const MODELS_API = 'https://d1rfabreh9lcnl.cloudfront.net/api/models/buckets?id=samplemodels';
        const MODEL_FALLBACK = [
            { name: 'Snowdon-Tower-(Complete).rvt', urn: 'urn:dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6c2FtcGxlbW9kZWxzL1Nub3dkb24tVG93ZXItKENvbXBsZXRlKS5ydnQ=' },
            { name: 'Office.rvt', urn: 'urn:dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6c2FtcGxlbW9kZWxzL09mZmljZS5ydnQ=' }
        ];
        const SNOWDON_URN = MODEL_FALLBACK[0].urn;

        async function fetchModelCatalog() {
            try {
                const resp = await fetch(MODELS_API);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const items = await resp.json();
                const models = items
                    .filter((m) => /\.rvt$/i.test(m.text))
                    .map((m) => ({ name: m.text, urn: 'urn:' + m.id }));
                if (models.length) return models;
            } catch (err) {
                console.warn('[phasing] model catalog fetch failed, using fallback:', err.message);
            }
            return MODEL_FALLBACK;
        }

        function fillModelSelect(catalog) {
            const sel = document.getElementById('model-select');
            sel.innerHTML = '';
            for (const m of catalog) {
                const opt = document.createElement('option');
                opt.value = m.urn;
                opt.textContent = m.name;
                sel.appendChild(opt);
            }
            sel.value = SNOWDON_URN;
        }

        // Load the picked model; on a switch the previous model is unloaded and
        // the phasing engine is reset so the new model's analysis starts clean.
        async function loadModel(viewer, urn) {
            const sel = document.getElementById('model-select');
            sel.disabled = true;
            try {
                // Resolve the CURRENT extension: keepCurrentModels:false tears
                // down all extensions on switch, so the initial instance dies.
                const ext = viewer.getExtension('PhasingExtension') || await viewer.loadExtension('PhasingExtension');
                ext.resetForNewModel();
                const models = viewer.impl?.modelQueue?.()?.getModels?.() ?? (viewer.model ? [viewer.model] : []);
                for (const m of models) {
                    try { viewer.unloadModel(m); } catch (err) { /* model may still be mid-load */ }
                }
                const doc = await new Promise((res, rej) =>
                    Autodesk.Viewing.Document.load(urn, res, (code, message) => rej(new Error(message || code))));
                const viewable = doc.getRoot().getDefaultGeometry();
                const model = await viewer.loadDocumentNode(doc, viewable, { keepCurrentModels: false });
                const fresh = viewer.getExtension('PhasingExtension') || await viewer.loadExtension('PhasingExtension');
                fresh.setPhases(DEFAULT_PHASES);
                fresh.addModel(model);
                viewer.fitToView();
            } catch (err) {
                console.error('[phasing] failed to load model', urn, err);
            } finally {
                sel.disabled = false;
            }
        }

        function initViewer(phases) {
            // LMV >= 7.119 enables "Large Model Experience" (HLOD / out-of-core
            // tile manager) by default. Its geometry streaming stalls when the
            // viewer is driven manually like we do here, so GEOMETRY_LOADED_EVENT
            // never fires and phasing never gets applied — leaving furniture and
            // windows visible at t=0. Disable it BEFORE Initializer reads the flag.
            if (Autodesk.Viewing.FeatureFlags?._setInitializationData) {
                Autodesk.Viewing.FeatureFlags._setInitializationData('LARGE_MODEL_EXPERIENCE', {
                    overridePreferenceValue: false
                });
            }

            Autodesk.Viewing.Initializer({
                env: 'AutodeskProduction',
                getAccessToken: (callback) => fetchAccessToken().then(
                    (token) => callback(token, TOKEN_EXPIRES_IN),
                    (err) => console.error('[phasing] access token fetch failed (no fallback token):', err.message)
                )
            }, () => {
                const viewer = new Autodesk.Viewing.GuiViewer3D(document.getElementById('viewer'), {
                    extensions: ['PhasingExtension']
                });
                viewer.start();
                viewer.setTheme('light-theme');
                // Rendering effects the app doesn't want (all default to ON):
                viewer.setGroundShadow(false);             // no ground shadow
                viewer.setGhosting(false);                 // no ghosting on search/isolate
                viewer.prefs.set('ambientShadows', false); // no ambient occlusion (SAO)
                window.viewer = viewer;
                viewer.loadExtension('PhasingExtension').then((ext) => {
                    ext.setPhases(phases);
                    // Model picker: populate from the bucket API and load the
                    // default (Snowdon Complete).
                    fetchModelCatalog().then((catalog) => {
                        fillModelSelect(catalog);
                        document.getElementById('model-select').addEventListener('change', (e) => {
                            loadModel(viewer, e.target.value);
                        });
                        loadModel(viewer, SNOWDON_URN);
                    });
                });
            });
        }

        initViewer(DEFAULT_PHASES);
    </script>
</body>
</html>
